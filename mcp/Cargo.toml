[package]
name = "wonderland-mcp-knowledge"
description = "知识库的 MCP 入口：headless 二进制，只读工具，由外部 AI 客户端经 stdio 拉起（ADR-010）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mcp-knowledge"
path = "src/main.rs"

[dependencies]
# 知识库 MCP 入口属于本插件；它与插件后端共用内部数据 crate 和 RAG 规划。
wonderland-knowledge = { path = "../crates/knowledge" }
wonderland-knowledge-library = { path = ".." }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
