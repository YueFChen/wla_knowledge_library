[package]
name = "wla_knowledge_library"
description = "知识库插件：独立多库、资料快照、本机嵌入检索与只读 MCP。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wonderland-plugin-sdk = { version = "0.2.0", path = "../../crates/plugin-sdk" }
# 知识库索引、缓存和检索实现是本插件的内部组件，由 UI 后端与 MCP 入口共用。
wonderland-knowledge = { path = "crates/knowledge" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# 页面元素模型定义在插件内部 crate（GUI 与 MCP 共用一份），因此这里连带启用它的绑定。
bindings = ["dep:ts-rs", "wonderland-knowledge/bindings"]

[[example]]
name = "generate_bindings"
required-features = ["bindings"]

[workspace]
resolver = "3"
members = [
    ".",
    "crates/knowledge",
    "mcp"
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
# 日志门面：内核重新导出宏与 `instrument`，工作区不直连 tracing（ADR-002）。
# `attributes` 是 `instrument` 的来源，显式列出以免被别处的 default-features = false 影响。
tracing = { version = "0.1", features = ["attributes"] }
# 日志实现：只有 crates/logging 使用，插件与其它 crate 不得依赖（ADR-002）。
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tracing-appender = "0.2"
# 输出层脱敏。
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
