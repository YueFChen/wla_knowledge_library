name: Build signed plugin package
on:
  workflow_dispatch:
    inputs:
      core_commit:
        description: Verified Core commit containing the shared package tools (40 hex).
        required: true
        type: string
      source_commit:
        description: Plugin source commit to build (40 hex).
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Require a private repository and explicit source commits
        shell: pwsh
        env:
          CORE_COMMIT: ${{ inputs.core_commit }}
          PLUGIN_COMMIT: ${{ inputs.source_commit }}
        run: |
          $event = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          if ($event.repository.private -ne $true) { throw 'Signed package builds require a private repository.' }
          if ($env:CORE_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or $env:PLUGIN_COMMIT -cnotmatch '^[a-f0-9]{40}$') { throw 'Supply exact verified commits.' }
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.WONDERLAND_CORE_REPOSITORY || 'YueFChen/Wonderland_Assistant' }}
          ref: ${{ inputs.core_commit }}
          path: core
          token: ${{ secrets.WONDERLAND_CORE_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          path: core/plugins/wla_knowledge_library
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.0
      - run: pnpm install --frozen-lockfile
        working-directory: core
      - run: pnpm install --frozen-lockfile
        working-directory: core/plugins/wla_knowledge_library
      - run: pnpm run typecheck
        working-directory: core/plugins/wla_knowledge_library
      - run: cargo test --locked
        working-directory: core/plugins/wla_knowledge_library
      - name: Build the complete signed package with the original identity
        run: pnpm run package:release
        working-directory: core/plugins/wla_knowledge_library
        env:
          PLUGIN_UPDATE_SIGNING_KEY: ${{ secrets.PLUGIN_UPDATE_SIGNING_KEY }}
          PLUGIN_UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.PLUGIN_UPDATE_SIGNING_PUBLIC_KEY }}
      - name: Verify the artifact and record its source commits
        shell: pwsh
        env:
          CORE_COMMIT: ${{ inputs.core_commit }}
          PLUGIN_COMMIT: ${{ inputs.source_commit }}
          PLUGIN_UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.PLUGIN_UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          $manifest = Get-Content -Raw 'core/plugins/wla_knowledge_library/package/manifest.json' | ConvertFrom-Json
          $file = "core/plugins/wla_knowledge_library/target/$($manifest.id)-$($manifest.version)-windows-$($manifest.platform.architecture).wplug"
          $result = node core/packages/plugin-tools/verify.mjs $file --signed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = $result | ConvertFrom-Json
          $receipt | Add-Member -NotePropertyName coreCommit -NotePropertyValue $env:CORE_COMMIT
          $receipt | Add-Member -NotePropertyName sourceCommit -NotePropertyValue $env:PLUGIN_COMMIT
          $receipt | ConvertTo-Json -Depth 50 | Set-Content -Encoding utf8 'core/plugins/wla_knowledge_library/target/package-receipt.json'
      - uses: actions/upload-artifact@v4
        with:
          name: signed-wla_knowledge_library-${{ github.run_id }}
          path: |
            core/plugins/wla_knowledge_library/target/*.wplug
            core/plugins/wla_knowledge_library/target/package-receipt.json
          if-no-files-found: error
          retention-days: 14
