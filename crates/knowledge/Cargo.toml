[package]
name = "wonderland-knowledge"
description = "多库资料、关键词检索与用户自选本机嵌入服务。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wonderland-plugin-sdk = { version = "0.2.0", path = "../../../../crates/plugin-sdk" }
# `#[instrument]` 展开成 `::tracing::...` 绝对路径。
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2 = "0.10"
reqwest = { version = "0.13", features = ["json", "stream"] }
wonderland-secret = { path = "../../../../crates/secret" }
url = "2"
pulldown-cmark = "0.13"
scraper = "0.24"
encoding_rs = "0.8"
flate2 = "1"
brotli = "8"
zip = { version = "8", default-features = false, features = ["deflate"] }
# 页面元素模型要生成 TS 绑定（由插件侧的生成器统一产出），与内核同一做法：可选依赖 + feature。
ts-rs = { workspace = true, optional = true }

[features]
bindings = ["dep:ts-rs"]
